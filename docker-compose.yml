services:
  site:
    build:
      context: .
      args:
        VITE_BFF_BASE_URL: ${VITE_BFF_BASE_URL:-}
        VITE_BFF_API_PREFIX: ${VITE_BFF_API_PREFIX:-/api/v1}
        VITE_USE_MOCK_BFF: ${VITE_USE_MOCK_BFF:-false}
    container_name: studybytes-site
    restart: unless-stopped
    ports:
      - "${SITE_HOST_BIND:-127.0.0.1}:${SITE_HOST_PORT:-3000}:3000"
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  backend:
    name: ${STUDYBYTES_BACKEND_NETWORK:?STUDYBYTES_BACKEND_NETWORK is required}
    external: true
