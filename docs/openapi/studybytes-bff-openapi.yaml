components:
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: SESSION
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
  schemas:
    UserRole:
      type: string
      enum:
      - STUDENT
      - TEACHER
      - ADMIN
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - BLOCKED
      - DELETED
    CourseDifficulty:
      type: string
      enum:
      - BEGINNER
      - INTERMEDIATE
      - ADVANCED
    CourseAccessType:
      type: string
      enum:
      - PUBLIC
      - UNLISTED
      - PRIVATE
    CourseStatus:
      type: string
      enum:
      - DRAFT
      - PENDING_REVIEW
      - CHANGES_REQUESTED
      - PUBLISHED
      - ARCHIVED
    CourseItemType:
      type: string
      enum:
      - THEORY
      - QUIZ
      - CODING
      - SQL
      - FILE
    ModuleDeadlineType:
      type: string
      enum:
      - NONE
      - ABSOLUTE
      - RELATIVE_FROM_START
    ModuleDeadlineStatus:
      type: string
      enum:
      - IN_PROGRESS_ON_TIME
      - OVERDUE
      - COMPLETED_ON_TIME
      - COMPLETED_LATE
    ContentBlockType:
      type: string
      enum:
      - TEXT
      - VIDEO
      - IMAGE
      - CODE
      - EMBED
      - FILE
    TestCaseVisibility:
      type: string
      enum:
      - OPEN
      - HIDDEN
    ComparisonMode:
      type: string
      enum:
      - EXACT
      - IGNORE_WHITESPACE
      - CUSTOM
    LearningStatus:
      type: string
      enum:
      - NOT_STARTED
      - IN_PROGRESS
      - COMPLETED
    SubmissionStatus:
      type: string
      enum:
      - PENDING
      - RUNNING
      - ACCEPTED
      - WRONG_ANSWER
      - RUNTIME_ERROR
      - COMPILATION_ERROR
      - TIME_LIMIT
      - MEMORY_LIMIT
      - SYSTEM_ERROR
    ApiValidationError:
      type: object
      properties:
        field:
          type: string
          nullable: true
          example: title
        message:
          type: string
          example: Title is required
      required:
      - message
    ApiErrorResponse:
      type: object
      properties:
        status:
          type: integer
          format: int32
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Validation failed
        validationErrors:
          type: array
          items:
            $ref: '#/components/schemas/ApiValidationError'
        code:
          type: string
        requestId:
          type: string
      required:
      - status
      - error
      - message
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: user@example.com
        fullName:
          type: string
          nullable: true
          example: User Name
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        preferredLocale:
          $ref: '#/components/schemas/Locale'
          nullable: true
      required:
      - id
      - email
      - fullName
      - role
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: teacher@studybytes.dev
        password:
          type: string
          format: password
          example: password123
      required:
      - email
      - password
    RegisterRequest:
      type: object
      properties:
        fullName:
          type: string
          example: Roman Aksenov
        email:
          type: string
          format: email
          example: roman@example.com
        password:
          type: string
          format: password
          example: password123
        role:
          allOf:
          - $ref: '#/components/schemas/UserRole'
          description: Optional. ADMIN registration must not be self-service.
      required:
      - fullName
      - email
      - password
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/CurrentUser'
        accessToken:
          type: string
          nullable: true
          example: jwt-access-token
        refreshToken:
          type: string
          nullable: true
          example: jwt-refresh-token
        tokenType:
          type: string
          nullable: true
          example: Bearer
        expiresIn:
          type: integer
          nullable: true
          format: int64
          example: 900
      required:
      - user
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
          nullable: true
          example: jwt-refresh-token
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          example: User Name
        avatarUrl:
          type: string
          nullable: true
          example: https://example.com/avatar.png
        bio:
          type: string
          nullable: true
          example: Java student
      required:
      - fullName
    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
      required:
      - currentPassword
      - newPassword
    CourseCatalogItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        slug:
          type: string
          example: java-core
        title:
          type: string
          example: Java Core
        shortDescription:
          type: string
          example: Learn Java fundamentals through structured lessons and practice
            tasks.
        difficulty:
          $ref: '#/components/schemas/CourseDifficulty'
        accessType:
          $ref: '#/components/schemas/CourseAccessType'
        enrollmentEnabled:
          type: boolean
          example: true
        coverImageUrl:
          type: string
          nullable: true
        estimatedMinutes:
          type: integer
          nullable: true
          format: int32
          example: 480
      required:
      - id
      - slug
      - title
      - shortDescription
      - difficulty
      - accessType
      - enrollmentEnabled
      - coverImageUrl
      - estimatedMinutes
    CourseItemSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 100
        title:
          type: string
          example: Introduction to Java
        itemType:
          $ref: '#/components/schemas/CourseItemType'
        orderIndex:
          type: integer
          format: int32
          example: 0
        estimatedMinutes:
          type: integer
          nullable: true
          format: int32
          example: 10
        completed:
          type: boolean
          nullable: true
          example: false
        locked:
          type: boolean
          nullable: true
          example: false
      required:
      - id
      - title
      - itemType
      - orderIndex
    CourseModuleSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 10
        title:
          type: string
          example: Java Basics
        orderIndex:
          type: integer
          format: int32
          example: 0
        deadlineType:
          $ref: '#/components/schemas/ModuleDeadlineType'
        deadlineAt:
          type: string
          format: date-time
          nullable: true
          example: '2026-06-01T23:59:00'
        timeLimitMinutes:
          type: integer
          nullable: true
          format: int32
          example: 120
        items:
          type: array
          items:
            $ref: '#/components/schemas/CourseItemSummary'
      required:
      - id
      - title
      - orderIndex
      - deadlineType
      - deadlineAt
      - timeLimitMinutes
      - items
    CourseDetails:
      allOf:
      - $ref: '#/components/schemas/CourseCatalogItem'
      - type: object
        properties:
          description:
            type: string
            example: Full course description.
          status:
            $ref: '#/components/schemas/CourseStatus'
          modules:
            type: array
            items:
              $ref: '#/components/schemas/CourseModuleSummary'
        required:
        - description
        - status
        - modules
    ContentBlockDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        blockType:
          $ref: '#/components/schemas/ContentBlockType'
        orderIndex:
          type: integer
          format: int32
