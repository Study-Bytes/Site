openapi: 3.0.3
info:
  title: StudyBytes Site-BFF API
  version: 1.0.0
  description: Frontend-facing BFF contract for the StudyBytes Site MVP. Site calls
    only this API under /api/v1; internal microservice routes are hidden behind the
    BFF. Public course endpoints and default locale must work without authentication.
    GET /me returns 401 for anonymous users; the Site treats that as anonymous state.
servers:
- url: http://localhost:8080/api/v1
  description: Local BFF
- url: https://studybytes.example.com/api/v1
  description: Production BFF placeholder
tags:
- name: Auth
- name: Profile
- name: Public courses
- name: Learning
- name: Submissions
- name: Teacher courses
- name: Teacher modules/items
- name: Teacher item editor
- name: Localization
- name: Admin courses
- name: Course moderation
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Register user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login user
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Logout current user
      operationId: logout
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh access token
      operationId: refreshToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    get:
      tags:
      - Profile
      summary: Get current user
      description: Returns the current authenticated user. Anonymous requests should return 401, not 500. The Site treats this 401 as anonymous state on public pages.
      operationId: getMe
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/profile:
    put:
      tags:
      - Profile
      summary: Update current user profile
      operationId: updateProfile
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/avatar:
    post:
      tags:
      - Profile
      summary: Upload current user avatar
      description: Primary avatar update flow used by Site. Accepts a multipart image file and returns the updated current user with avatarUrl populated by the BFF.
      operationId: uploadAvatar
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG, JPEG, WebP, or GIF image, up to 5 MB.
      responses:
        '200':
          description: Avatar uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: Payload Too Large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '415':
          description: Unsupported Media Type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/password:
    put:
      tags:
      - Profile
      summary: Change current user password
      operationId: changePassword
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /courses:
    get:
      tags:
      - Public courses
      summary: List public courses
      description: Public endpoint. Must not require authentication. Used by anonymous and authenticated users.
      operationId: listCourses
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: difficulty
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CourseDifficulty'
      - name: accessType
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CourseAccessType'
      - name: enrollmentEnabled
        in: query
        required: false
        schema:
          type: boolean
      - name: minEstimatedMinutes
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: maxEstimatedMinutes
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Courses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseCatalogListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /courses/{courseId}:
    get:
      tags:
      - Public courses
      summary: Get public course details
      description: Public endpoint. Must not require authentication. Hidden tests, expected outputs, and correct quiz answers must not be returned.
      operationId: getCourse
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Course details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetails'
        '404':
          $ref: '#/components/responses/NotFound'
  /course-items/{itemId}:
    get:
      tags:
      - Public courses
      summary: Get public course item preview
      description: Public endpoint if previews are enabled. Must return student-safe preview content only.
      operationId: getCourseItemPreview
      parameters:
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Course item preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseItemPreview'
        '404':
          $ref: '#/components/responses/NotFound'
  /learn/courses/{courseId}/enroll:
    post:
      tags:
      - Learning
      summary: Enroll current user in course
      operationId: enrollCourse
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Enrollment state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollCourseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /learn/my-courses:
    get:
      tags:
      - Learning
      summary: List current user enrollments
      operationId: getMyCourses
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          description: Enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnrollmentSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /learn/courses/{courseId}:
    get:
      tags:
      - Learning
      summary: Get learning course page data
      operationId: getLearningCourse
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Learning course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningCourse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /learn/courses/{courseId}/leaderboard:
    get:
      tags:
      - Learning
      operationId: getCourseLeaderboard
      summary: Get course progress leaderboard
      description: Returns top 10 enrolled users by progress percent and the current JWT user's own place. Ties are ordered deterministically and do not expand the top 10 list.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Course leaderboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseLeaderboardResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /learn/courses/{courseId}/modules/{moduleId}/start:
    post:
      tags:
      - Learning
      summary: Start current user's module timer
      operationId: startModule
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - $ref: '#/components/parameters/CourseId'
      - name: moduleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Module start state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleStartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /learn/courses/{courseId}/modules/{moduleId}/deadline-state:
    get:
      tags:
      - Learning
      summary: Get module deadline state
      operationId: getModuleDeadlineState
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - $ref: '#/components/parameters/CourseId'
      - name: moduleId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: deadlineAt
        in: query
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Module deadline state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleDeadlineState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /learn/courses/{courseId}/items/{itemId}:
    get:
      tags:
      - Learning
      summary: Get learning item page data
      operationId: getLearningItem
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Learning item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /learn/courses/{courseId}/items/{itemId}/run:
    post:
      tags:
      - Submissions
      summary: Run current item without final submission
      operationId: runItem
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunItemRequest'
      responses:
        '200':
          description: Run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /learn/courses/{courseId}/items/{itemId}/submit:
    post:
      tags:
      - Submissions
      summary: Submit current item attempt
      operationId: submitItem
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitItemRequest'
      responses:
        '200':
          description: Submission result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /learn/courses/{courseId}/items/{itemId}/submissions:
    get:
      tags:
      - Submissions
      summary: List current user submissions for item
      operationId: getItemSubmissions
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: itemId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Submission history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubmissionHistoryItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /learn/submissions/{submissionId}:
    get:
      tags:
      - Submissions
      summary: Get submission result
      operationId: getSubmission
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: submissionId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /teacher/courses/{courseId}/submit-review:
    post:
      tags:
      - Teacher courses
      summary: Submit course for admin moderation
      operationId: submitCourseForReview
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Submitted for review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourseDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /admin/courses:
    get:
      tags:
      - Admin courses
      summary: List all courses for admin
      operationId: listAdminCourses
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CourseStatus'
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: Admin course list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeacherCourseSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/courses/moderation:
    get:
      tags:
      - Course moderation
      summary: List courses waiting for moderation
      operationId: listCourseModerationQueue
      security:
      - BearerAuth: []
      - CookieAuth: []
      responses:
        '200':
          description: Moderation queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeacherCourseSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/courses/{courseId}/review:
    get:
      tags:
      - Course moderation
      summary: Get course review details
      operationId: getCourseReview
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Course review details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourseDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/courses/{courseId}/approve:
    post:
      tags:
      - Course moderation
      summary: Approve course publication
      operationId: approveCourse
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Approved and published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourseDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/courses/{courseId}/reject:
    post:
      tags:
      - Course moderation
      summary: Reject course and request changes
      operationId: rejectCourse
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseModerationReviewRequest'
      responses:
        '200':
          description: Changes requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourseDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /teacher/courses:
    get:
      tags:
      - Teacher courses
      summary: List teacher/admin courses
      operationId: listTeacherCourses
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CourseStatus'
      - name: difficulty
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CourseDifficulty'
      - name: accessType
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CourseAccessType'
      - name: createdByUserId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Teacher courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeacherCourseSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags:
      - Teacher courses
      summary: Create course
      operationId: createTeacherCourse
      security:
      - BearerAuth: []
      - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpsertRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourseDetails'
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourseDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /teacher/courses/{courseId}:
    get:
      tags:
      - Teacher courses
      summary: Get teacher course details
      operationId: getTeacherCourse
      security:
      - BearerAuth: []
      - CookieAuth: []
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherCourseDetails'
        '401':
