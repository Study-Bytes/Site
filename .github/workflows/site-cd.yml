name: Site CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Site before deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy Site to VPS
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    environment:
      name: production

    steps:
      - name: Validate required deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_BASE_PATH: ${{ secrets.VPS_DEPLOY_BASE_PATH }}
          STUDYBYTES_BACKEND_NETWORK: ${{ secrets.STUDYBYTES_BACKEND_NETWORK }}
        run: |
          test -n "$VPS_HOST" || (echo "VPS_HOST secret is missing" && exit 1)
          test -n "$VPS_PORT" || (echo "VPS_PORT secret is missing" && exit 1)
          test -n "$VPS_USER" || (echo "VPS_USER secret is missing" && exit 1)
          test -n "$VPS_SSH_KEY" || (echo "VPS_SSH_KEY secret is missing" && exit 1)
          test -n "$VPS_DEPLOY_BASE_PATH" || (echo "VPS_DEPLOY_BASE_PATH secret is missing" && exit 1)
          test -n "$STUDYBYTES_BACKEND_NETWORK" || (echo "STUDYBYTES_BACKEND_NETWORK secret is missing" && exit 1)

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/site_deploy_key
          chmod 600 ~/.ssh/site_deploy_key
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_BASE_PATH: ${{ secrets.VPS_DEPLOY_BASE_PATH }}
          STUDYBYTES_BACKEND_NETWORK: ${{ secrets.STUDYBYTES_BACKEND_NETWORK }}
        run: |
          SITE_DEPLOY_PATH="${VPS_DEPLOY_BASE_PATH%/}/site"

          ssh -i ~/.ssh/site_deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "set -euo pipefail
             SITE_DEPLOY_PATH='$SITE_DEPLOY_PATH'
             STUDYBYTES_BACKEND_NETWORK='$STUDYBYTES_BACKEND_NETWORK'
             export STUDYBYTES_BACKEND_NETWORK

             cd \"\$SITE_DEPLOY_PATH\"
             git config --global --add safe.directory \"\$SITE_DEPLOY_PATH\"

             test -f .env || (echo '.env is missing on VPS. Create it before deployment.' && exit 1)
             grep -q '^VITE_USE_MOCK_BFF=false' .env || (echo 'VITE_USE_MOCK_BFF=false must be set in production .env' && exit 1)

             git fetch origin main
             git checkout main
             git pull --ff-only origin main

             docker compose up -d --build
             docker compose ps

             for attempt in \$(seq 1 40); do
               if docker compose exec -T site node -e \"fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"; then
                 exit 0
               fi
               echo \"Waiting for Site health check... attempt \$attempt/40\"
               sleep 3
             done

             docker compose logs --tail=200 site
             exit 1"
